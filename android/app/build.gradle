plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.niftylab.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.niftylab.mobile'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '2.0-standalone'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = "3.13"
        pip {
            install("fastapi>=0.115,<1.0")
            install("uvicorn>=0.30,<1.0")
            install("pandas==2.1.3")
            install("requests>=2.32,<3.0")
            install("python-multipart>=0.0.9")
            install("openpyxl>=3.1")
        }
    }
}
