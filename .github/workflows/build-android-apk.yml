name: Build standalone NIFTY LAB Android APK

on:
  push:
    branches:
      - android-apk
    paths:
      - 'android/**'
      - 'app/**'
      - 'static/**'
      - 'frontend/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build complete NIFTY LAB web UI
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Smoke-test bundled FastAPI routes and original calculations
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend smoke-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi>=0.115,<1.0" "uvicorn>=0.30,<1.0" "pandas>=2.2,<3.0" "requests>=2.32,<3.0" "python-multipart>=0.0.9" "openpyxl>=3.1" "httpx>=0.27,<1.0"

      - name: Verify local API, UI assets and unchanged level formulas
        env:
          NIFTYLAB_PROJECT_ROOT: ${{ github.workspace }}
          CACHE_DB: ${{ runner.temp }}/nifty-standalone-smoke.sqlite3
        run: |
          python - <<'PY'
          import pandas as pd
          from fastapi.testclient import TestClient
          from app.main import app
          from app.data import select_strikes, support_resistance

          client = TestClient(app)
          assert client.get("/api/health").status_code == 200
          assert client.get("/").status_code == 200
          assert client.get("/workspace").status_code == 200
          assert client.get("/assets/legacy-chart-bridge.js").status_code == 200

          levels = support_resistance(25000, 100, 80)
          assert levels == {"S1": 24920.0, "R1": 25100.0, "S2": 24820.0, "R2": 25180.0}, levels

          rows = pd.DataFrame([
              {"strike": 25000, "option_type": "CE", "close": 100},
              {"strike": 25000, "option_type": "PE", "close": 98},
              {"strike": 25050, "option_type": "CE", "close": 50},
              {"strike": 25050, "option_type": "PE", "close": 49},
          ])
          _, atm = select_strikes(rows, 25000, 50, 1, 1)
          assert atm == 25050.0, atm
          print("PASS: local API, React assets, legacy workspace, HLC ATM and S/R formula checks.")
          PY

      - name: Set up Python for Chaquopy build
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Bundle original Python engine and UI assets
        run: |
          mkdir -p android/app/src/main/python/app
          cp app/*.py android/app/src/main/python/app/
          mkdir -p android/app/src/main/assets/niftylab_root/static
          cp -R static/. android/app/src/main/assets/niftylab_root/static/
          mkdir -p android/app/src/main/assets/niftylab_root/frontend/dist
          cp -R frontend/dist/. android/app/src/main/assets/niftylab_root/frontend/dist/
          test -f android/app/src/main/python/app/main.py
          test -f android/app/src/main/assets/niftylab_root/static/index.html
          test -f android/app/src/main/assets/niftylab_root/frontend/dist/index.html

      - name: Build standalone debug APK with embedded Python and Pandas
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Verify standalone APK contents
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libpython3.13.so'
          unzip -l "$APK" | grep -q 'assets/niftylab_root/static/index.html'
          unzip -l "$APK" | grep -q 'assets/niftylab_root/frontend/dist/index.html'
          unzip -l "$APK" | grep -q 'assets/chaquopy'
          echo "Standalone APK contains embedded Python, bundled UI and backend assets."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NIFTY-LAB-Standalone-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
